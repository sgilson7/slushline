<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{game.name}}</title>
<!-- The game on the iPad (2026-10-10): added to the home screen it opens
     with no browser around it. The manifest and the theme color are written
     by package-web.sh from data/copy.en.json and data/palette.json. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{game.name}}">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="{{palette:paper}}">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="art/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Every word on this page is a {{key}} token. package-web.sh fills each one
     from data/copy.en.json, and crates/content/tests/copy.rs fails on any
     text the page writes for itself. -->
<main id="app">
  <header id="masthead">
    <h1 id="title">{{game.name}}</h1>
  </header>
  <p id="status" role="status">{{game.loading}}</p>
  <p id="loading-error" role="alert" hidden>{{game.loading_error}}</p>
  <noscript><p>{{game.fallback}}</p></noscript>
  <div id="hud" role="status" hidden></div>
  <div id="stage-wrap">
    <canvas id="stage" aria-label="{{game.canvas_name}}" width="1200" height="510" hidden></canvas>
    <canvas id="groove" aria-hidden="true" width="1200" height="510" hidden></canvas>
    <div id="judge" aria-hidden="true" hidden></div>
  </div>
  <section id="screen" hidden></section>
  <!-- The soundtrack (Sam, 2026-10-06), after Gear Master's: SoundCloud's own
       widget, streamed from SoundCloud. No audio file of it is in the repo. -->
  <aside id="music" aria-label="{{music.title}}">
    <div class="music-head">
      <span>{{music.title}}</span>
      <button id="music-fold" type="button" class="quiet" aria-expanded="true">{{music.fold}}</button>
    </div>
    <iframe id="music-player" title="{{music.title}}" allow="autoplay; encrypted-media" scrolling="no" frameborder="no"
      src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F78084887&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false&amp;visual=false"></iframe>
    <p id="music-blocked" hidden>{{music.blocked}}</p>
    <div class="music-row">
      <button id="music-mute" type="button" class="quiet">{{music.mute}}</button>
      <input id="music-volume" type="range" min="0" max="100" step="5" aria-label="{{music.volume}}">
      <span id="music-level" data-value="1"></span>
    </div>
  </aside>
  <footer id="foot">
    <a id="back" href="https://sgilson7.github.io/">{{game.back_link}}</a>
    <span id="build">{{game.build}}</span>
  </footer>
</main>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
